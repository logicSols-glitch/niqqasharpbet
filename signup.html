<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="styles.css">
    <style>
/* styles.css */
.requirements {
    margin-top: 10px;
}

.requirements p {
    font-size: 14px;
}

.requirements .valid {
    color: green;
}

.requirements .invalid {
    color: red;
}

.password-container {
    position: relative;
}

#password {
    width: 100%;
    padding-right: 40px;
}

#toggle-password {
    position: absolute;
    top: 50%;
    right: 10px;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    font-size: 16px;
}

    </style>
</head>
<body>
    <div class="signup-container">
        <h2>Sign Up</h2>
        <form action="./php/signup.php" method="post">
            <input type="text" name="username" placeholder="Username" required>
            <input type="text" name="email_or_phone" placeholder="Email or Phone Number" required>
            <div class="password-container">
                <input type="password" id="password" name="password" placeholder="Password" required>
                <button type="button" id="toggle-password" aria-label="Show password">👁️</button>
            </div>
            <div id="password-requirements" class="requirements">
                <p id="length" class="invalid">Must be at least 8 characters long</p>
                <p id="uppercase" class="invalid">Must contain an uppercase letter</p>
                <p id="number" class="invalid">Must contain a number</p>
            </div>
            <button type="submit">Sign Up</button>
        </form>
    </div>


<script>
        // script.js
// script.js
document.addEventListener('DOMContentLoaded', function () {
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('toggle-password');
    const requirements = document.getElementById('password-requirements');
    const lengthRequirement = document.getElementById('length');
    const uppercaseRequirement = document.getElementById('uppercase');
    const numberRequirement = document.getElementById('number');

    togglePassword.addEventListener('click', function () {
        const type = passwordInput.type === 'password' ? 'text' : 'password';
        passwordInput.type = type;
        this.textContent = type === 'password' ? '👁️' : '🙈';
        this.setAttribute('aria-label', type === 'password' ? 'Show password' : 'Hide password');
    });

    passwordInput.addEventListener('input', function () {
        const password = passwordInput.value;
        const isLengthValid = password.length >= 8;
        const isUppercaseValid = /[A-Z]/.test(password);
        const isNumberValid = /[0-9]/.test(password);

        lengthRequirement.classList.toggle('valid', isLengthValid);
        lengthRequirement.classList.toggle('invalid', !isLengthValid);
        uppercaseRequirement.classList.toggle('valid', isUppercaseValid);
        uppercaseRequirement.classList.toggle('invalid', !isUppercaseValid);
        numberRequirement.classList.toggle('valid', isNumberValid);
        numberRequirement.classList.toggle('invalid', !isNumberValid);

        // Display requirements only if at least one requirement is not met
        if (!isLengthValid || !isUppercaseValid || !isNumberValid) {
            requirements.classList.remove('hidden');
        } else {
            requirements.classList.add('hidden');
        }
    });
});

</script>
</body>
</html>
