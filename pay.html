<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form id="paymentForm">
        <input type="email" id="email-address" required placeholder="Enter your email" />
        <input type="number" id="amount" required placeholder="Enter amount" />
        <button type="submit"> Pay </button>
      </form>
      
      <script src="https://js.paystack.co/v1/inline.js"></script> 
      
      <script>
        const paymentForm = document.getElementById('paymentForm');
        paymentForm.addEventListener('submit', payWithPaystack, false);
      
        function payWithPaystack(e) {
          e.preventDefault();
      
          let handler = PaystackPop.setup({
            key: 'pk_test_878a26fcd09594a0743a3edfb53fdc9725ce1fc1', // Replace with your public key
            email: document.getElementById('email-address').value,
            amount: document.getElementById('amount').value * 100, // the amount value is in kobo
            currency: 'NGN',
            ref: '' + Math.floor((Math.random() * 1000000000) + 1), // Generate a unique reference
            metadata: {
               custom_fields: [
                  {
                      display_name: "Mobile Number",
                      variable_name: "mobile_number",
                      value: "+2348012345678"
                  }
               ]
            },
            callback: function(response){
              let message = 'Payment complete! Reference: ' + response.reference;
              alert(message);
              window.location.href = 'verify_payment.php?reference=' + response.reference;
            },
            onClose: function(){
              alert('Transaction was not completed, window closed.');
            }
          });
      
          handler.openIframe();
        }
      </script>
      
</body>
</html>
